<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Zagrebačka pivovara - pristup dokumentaciji</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
            font-family: Tahoma, Arial, sans-serif;
            color: #222;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 380px;
            padding: 35px;
            box-sizing: border-box;
            border-radius: 12px;
            box-shadow: 0 3px 18px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            color: #1f3f75;
            font-size: 25px;
            margin-top: 0;
        }

        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #1f3f75;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #31558f;
        }

        #poruka {
            color: #c62828;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>Zagrebačka pivovara</h1>

    <p>Za pristup dokumentaciji strojeva unesite pristupni PIN.</p>

    <input
        type="password"
        id="pin"
        placeholder="Unesite PIN"
        inputmode="numeric"
        autocomplete="off"
    >

    <button onclick="provjeriPIN()">PRISTUPI</button>

    <div id="poruka"></div>

</div>

<script>

    // OVDJE MIJENJAŠ PIN
    const pristupniPIN = "1234";

    // IP ADRESA HFS SERVERA
    const baseIP = "http://10.43.144.71";

    // POVEZIVANJE ID-a S MAPOM STROJA
    // POPIS STROJEVA
const strojevi = {
1: "CAN/Apolo",
2: "CAN/Cantronic",
3: "CAN/Checkmat1",
4: "CAN/Checkmat2",
5: "CAN/Depaletizator",
6: "CAN/Lift_Transport_Tornjeva",
7: "CAN/Modulpack",
8: "CAN/Omatalica",
9: "CAN/Pasterizator",
10: "CAN/Punjac",
11: "CAN/Transport_Paleta",
12: "CAN/Transport_Praznih_Limenki",
13: "L2/Depaletizator",
14: "L2/Etiketirka",
15: "L2/FBI",
16: "L2/Ispakivac",
17: "L2/Linatronic",
18: "L2/Metec_Upakivac",
19: "L2/Paletizator",
20: "L2/Pasterizator",
21: "L2/Perac_Gajbi",
22: "L2/Punjac",
23: "L2/Transport",
24: "L2/Upakivac",
25: "L3/Checkmat_Eti",
26: "L3/Etiketirka",
27: "L3/Punjac",
28: "PET/Palet",
29: "PET/Puhalica",
30: "PET/Transport_Paketa",
31: "PET/Transport_Paleta",
32: "CAN/Susac_Punih_Limenki",
33: "CAN/Komunikacijski_Ormar",
34: "CAN/Variopack",
35: "CAN/Transport_Paketa",
36: "KEG/Paletizer",
37: "L3/FBI_Heuft",
38: "L3/Peracica",
39: "L3/Transport",
40: "PET/Etiketirka",
41: "PET/FBI_Heuft",
42: "PET/Omatalica",
43: "PET/Punjac",
44: "PET/Zracni_Transport"
};

    // UZMI ID IZ QR KODA
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    function provjeriPIN() {

        const uneseniPIN = document.getElementById("pin").value;
        const odrediste = strojevi[id];

        if (!odrediste) {
            document.getElementById("poruka").innerText =
                "Nepostojeći ID stroja.";
            return;
        }

        if (uneseniPIN === pristupniPIN) {

            window.location.href =
                baseIP + "/" + odrediste + "/";

        } else {

            document.getElementById("poruka").innerText =
                "Pogrešan PIN. Pokušajte ponovno.";

        }
    }

    // ENTER TIPKA TAKOĐER POTVRĐUJE PIN
    document.getElementById("pin").addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            provjeriPIN();
        }
    });

</script>

</body>
</html>
