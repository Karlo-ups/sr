<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Redirect</title>
</head>
<body>

<script>

// MIJENJAŠ SAMO OVO AKO SE IP PROMIJENI
const baseIP = "http://10.43.144.71";

// POPIS STROJEVA
const strojevi = {

1: "CAN/Apolo",
2: "CAN/Cantronic",
3: "CAN/Checkmat1",
4: "CAN/Checkmat2",
5: "CAN/Depaletizator",
6: "CAN/Lift",
7: "CAN/Modulpack",
8: "CAN/Omatalica",
9: "CAN/Pasterizator",
10: "CAN/Punjac",
11: "CAN/Transport",
12: "CAN/Variopack"

};

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

// pronađi naziv stroja
const stroj = strojevi[id];

if (stroj) {

window.location.href =
baseIP + "/" + stroj + "/";

}
else {

document.body.innerHTML =
"<h2>Greška: stroj ne postoji</h2>";

}

</script>

</body>
</html>
